<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Start your free trial - Streamly</title>
    <style>
      body { font-family: system-ui, sans-serif; background: #0f1020; color: #f2f0fa; margin: 0; }
      .wrap { max-width: 420px; margin: 48px auto; padding: 32px; background: #1a1b30; border-radius: 16px; }
      label { display: block; margin: 12px 0 4px; }
      input[type="email"], input[type="password"], input[type="text"] { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #444; }
      .agree { display: flex; gap: 8px; align-items: flex-start; margin: 16px 0; }
      .agree label { margin: 0; }
      button { width: 100%; padding: 12px; border: 0; border-radius: 10px; background: #e5484d; color: white; font-size: 16px; }
      .fine { font-size: 12px; color: #b7b4c9; }
      a { color: #c7a7ff; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Watch free for 7 days</h1>
      <p>Thousands of films and series. No ads on the Premium plan.</p>
      <form action="#" method="post" onsubmit="return false">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" />
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="new-password" />
        <label for="card">Card number</label>
        <input id="card" type="text" autocomplete="cc-number" inputmode="numeric" />
        <div class="agree">
          <input id="agree" type="checkbox" />
          <label for="agree">I agree to the <a href="terms-v1.html">Terms of Service</a> and <a href="#privacy">Privacy Policy</a>.</label>
        </div>
        <p class="fine">Free for 7 days, then GHS 120 per month. Your subscription renews automatically until you cancel.</p>
        <button type="submit">Start free trial</button>
      </form>
      <p class="fine">Streamly is a fictional service used to demonstrate Specter.</p>
    </div>
  </body>
</html>
