<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Ghostly Gazette - no reject button</title>
    <style>
      body { font-family: Georgia, serif; max-width: 720px; margin: 0 auto; padding: 24px 24px 200px; line-height: 1.6; }
      .cookie-bar { left: 0; right: 0; bottom: 0; background: #fff; border-top: 2px solid #333; padding: 16px 24px; font-family: system-ui, sans-serif; }
      .cookie-bar button { padding: 10px 16px; margin-right: 8px; border-radius: 8px; border: 1px solid #333; background: #fff; }
    </style>
  </head>
  <body>
    <main>
      <h1>Night market opens on the pier</h1>
      <p>A fictional article used to show a banner that offers no reject button on its first screen.</p>
    </main>
    <div class="cookie-bar" style="position: fixed">
      <p>This site uses cookies for advertising and analytics.</p>
      <button type="button">Accept all</button>
      <button type="button">Manage preferences</button>
    </div>
  </body>
</html>
